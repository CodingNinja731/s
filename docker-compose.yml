version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - MONGO_URI=mongodb://db:27017/student-guidance
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      # Mount the local backend code into the container at /app
      - ./backend:/app
      # Use an anonymous volume to prevent local node_modules from overwriting the container's
      - /app/node_modules

  db:
    image: mongo:6.0 # Use a specific, stable version
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local
